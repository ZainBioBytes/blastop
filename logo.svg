<svg width="680" height="340" viewBox="0 0 680 340" role="img" xmlns="http://www.w3.org/2000/svg">
<title>blastop logo</title>
<desc>blastop tool logo featuring stylized DNA helix and BLAST filtering concept with the tool name</desc>
<defs>
  <style>
    .bg { fill: #0f1923; }
    .helix-strand-a { fill: none; stroke: #4a9eff; stroke-width: 3; stroke-linecap: round; }
    .helix-strand-b { fill: none; stroke: #2dd4a0; stroke-width: 3; stroke-linecap: round; }
    .rung { stroke: #ffffff; stroke-width: 1.5; stroke-linecap: round; opacity: 0.25; }
    .rung-hi { stroke: #f5a623; stroke-width: 2; stroke-linecap: round; opacity: 0.9; }
    .node-a { fill: #4a9eff; }
    .node-b { fill: #2dd4a0; }
    .node-hi { fill: #f5a623; }
    .funnel-body { fill: none; stroke: #4a9eff; stroke-width: 2; opacity: 0.7; }
    .funnel-fill { fill: #4a9eff; opacity: 0.08; }
    .arrow-line { fill: none; stroke: #4a9eff; stroke-width: 2; stroke-linecap: round; marker-end: url(#arr); }
    .label-main { font-family: monospace; font-size: 52px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
    .label-sub { font-family: monospace; font-size: 13px; font-weight: 400; fill: #7a9bb5; letter-spacing: 2px; }
    .label-b { fill: #4a9eff; }
    .label-op { fill: #2dd4a0; }
    .tag { font-family: monospace; font-size: 11px; fill: #f5a623; opacity: 0.85; }
    .badge { fill: #f5a623; opacity: 0.15; }
    .line-grid { stroke: #ffffff; stroke-width: 0.4; opacity: 0.06; }
  </style>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#4a9eff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="340" rx="16" class="bg"/>

<line x1="40" y1="0" x2="40" y2="340" class="line-grid"/>
<line x1="160" y1="0" x2="160" y2="340" class="line-grid"/>
<line x1="280" y1="0" x2="280" y2="340" class="line-grid"/>
<line x1="400" y1="0" x2="400" y2="340" class="line-grid"/>
<line x1="520" y1="0" x2="520" y2="340" class="line-grid"/>
<line x1="640" y1="0" x2="640" y2="340" class="line-grid"/>
<line x1="0" y1="80" x2="680" y2="80" class="line-grid"/>
<line x1="0" y1="170" x2="680" y2="170" class="line-grid"/>
<line x1="0" y1="260" x2="680" y2="260" class="line-grid"/>

<path class="helix-strand-a" d="M60 30 C90 55, 90 95, 60 120 C30 145, 30 185, 60 210 C90 235, 90 275, 60 300"/>
<path class="helix-strand-b" d="M100 30 C70 55, 70 95, 100 120 C130 145, 130 185, 100 210 C70 235, 70 275, 100 300"/>

<line x1="61" y1="60" x2="99" y2="60" class="rung"/>
<line x1="62" y1="90" x2="98" y2="90" class="rung"/>
<line x1="60" y1="120" x2="100" y2="120" class="rung"/>
<line x1="62" y1="150" x2="98" y2="150" class="rung"/>
<line x1="61" y1="180" x2="99" y2="180" class="rung"/>
<line x1="62" y1="240" x2="98" y2="240" class="rung"/>
<line x1="61" y1="270" x2="99" y2="270" class="rung"/>
<line x1="62" y1="300" x2="98" y2="300" class="rung"/>

<line x1="60" y1="210" x2="100" y2="210" class="rung-hi"/>
<circle cx="60" cy="210" r="5" class="node-hi"/>
<circle cx="100" cy="210" r="5" class="node-hi"/>

<circle cx="60" cy="30" r="4" class="node-a"/>
<circle cx="100" cy="30" r="4" class="node-b"/>
<circle cx="60" cy="300" r="4" class="node-a"/>
<circle cx="100" cy="300" r="4" class="node-b"/>

<polygon points="155,90 225,90 205,145 175,145" class="funnel-fill"/>
<polygon points="155,90 225,90 205,145 175,145" class="funnel-body"/>
<line x1="190" y1="145" x2="190" y2="175" class="arrow-line"/>
<circle cx="190" cy="192" r="8" class="node-hi"/>

<text x="250" y="175" class="label-main"><tspan class="label-b">blast</tspan><tspan class="label-op">op</tspan></text>
<text x="252" y="205" class="label-sub">BLAST OUTPUT PROCESSOR</text>

<rect x="252" y="224" width="102" height="22" rx="4" class="badge"/>
<text x="261" y="239" class="tag">--min_identity</text>
<rect x="362" y="224" width="96" height="22" rx="4" class="badge"/>
<text x="371" y="239" class="tag">--min_coverage</text>
<rect x="466" y="224" width="62" height="22" rx="4" class="badge"/>
<text x="475" y="239" class="tag">--taxa</text>

<text x="610" y="58" class="label-sub" style="font-size:11px; fill:#2dd4a0; opacity:0.7;">v1.0</text>

<text x="252" y="270" style="font-family:monospace; font-size:10px; fill:#4a9eff; opacity:0.3; letter-spacing:3px;">ATGCTAGCTAGCTA</text>
<text x="252" y="286" style="font-family:monospace; font-size:10px; fill:#2dd4a0; opacity:0.2; letter-spacing:3px;">GCATGATCGATCGAT</text>
<text x="252" y="302" style="font-family:monospace; font-size:10px; fill:#4a9eff; opacity:0.15; letter-spacing:3px;">CTAGCTAGCTAGCTA</text>
</svg>
